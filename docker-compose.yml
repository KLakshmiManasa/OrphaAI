version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: orphaai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orphaai-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=sqlite:///orphaai.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=orphaai-production-secret-key-change-me
      - JWT_SECRET_KEY=orphaai-jwt-production-secret-key-change-me-32bytes
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./OrphaAI
      dockerfile: Dockerfile
    container_name: orphaai-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE=http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
