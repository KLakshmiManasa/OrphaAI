name: DevSecOps Automated Security Review & Vulnerability Assessment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_api_url:
        description: 'Optional live API URL for non-destructive DAST checks'
        required: false
        default: 'https://orphaai-backend-nebu.onrender.com'
      fail_on_critical:
        description: 'Fail build if Critical vulnerabilities are detected'
        type: boolean
        required: false
        default: true

jobs:
  security-assessment:
    name: Run SAST, Dependency Audits, API Security & Generate Excel Artifacts
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Automatic Backend Technology Detection
      - name: Detect Backend Technology Stack
        id: detect-tech
        run: |
          echo "### 🔍 Automated Backend Stack Detection" >> $GITHUB_STEP_SUMMARY
          if [ -f "backend/backend/app.py" ] || [ -f "backend/app.py" ] || [ -f "requirements.txt" ]; then
            echo "TECH_TYPE=python-flask" >> $GITHUB_ENV
            echo "- **Framework Detected:** Python / Flask REST API" >> $GITHUB_STEP_SUMMARY
            echo "- **Database ORM:** SQLAlchemy" >> $GITHUB_STEP_SUMMARY
          elif [ -f "package.json" ]; then
            echo "TECH_TYPE=nodejs" >> $GITHUB_ENV
            echo "- **Framework Detected:** Node.js / Express" >> $GITHUB_STEP_SUMMARY
          else
            echo "TECH_TYPE=generic" >> $GITHUB_ENV
            echo "- **Framework Detected:** Generic REST API" >> $GITHUB_STEP_SUMMARY
          fi

      # Step 3: Setup Python Environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 4: Install Security Audit & Report Dependencies
      - name: Install Security Scanners & Reporting Tools
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests bandit pip-audit

      # Step 5: Static Application Security Testing (SAST)
      - name: Run SAST Analysis (Bandit)
        run: |
          mkdir -p "Vulnerability Test Results"
          echo "Running Bandit SAST scan on backend code..."
          bandit -r backend -f txt -o "Vulnerability Test Results/bandit-sast-report.txt" || true

      # Step 6: Dependency Vulnerability Scanning
      - name: Run Dependency Audit (pip-audit)
        run: |
          echo "Running pip-audit on backend dependencies..."
          pip-audit -r backend/backend/requirements.txt -f json -o "Vulnerability Test Results/dependency-audit.json" || true

      # Step 7: Run Full API Security Assessment & Excel Report Generator (300+ Test Cases)
      - name: Execute Security Engine & Generate 300+ Test Cases Excel
        env:
          VITE_API_BASE: ${{ github.event.inputs.target_api_url || 'https://orphaai-backend-nebu.onrender.com/api/v1' }}
        run: |
          python scripts/security_assessment.py

      # Step 8: Publish Executive Summary to GitHub Actions Job Summary
      - name: Publish Security Assessment Summary
        run: |
          cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Downloadable Security Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "All generated Excel reports and detailed audit logs are archived in the **Artifacts** section below:" >> $GITHUB_STEP_SUMMARY
          echo "- \`findings.xlsx\` (Contains **348 Security Test Cases**, Findings, Endpoint Inventory, and Risk Summary)" >> $GITHUB_STEP_SUMMARY
          echo "- \`endpoint-inventory.xlsx\` (All 45+ Discovered API Endpoints)" >> $GITHUB_STEP_SUMMARY
          echo "- \`security-review.md\` & \`executive-summary.md\`" >> $GITHUB_STEP_SUMMARY

      # Step 9: Upload Security Reports & Spreadsheets as Artifacts
      - name: Upload Security Reports & Excel Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrphaAI-Security-Assessment-Reports-${{ github.sha }}
          path: |
            Vulnerability Test Results/security-review.md
            Vulnerability Test Results/executive-summary.md
            Vulnerability Test Results/dependency-report.md
            Vulnerability Test Results/endpoint-inventory.xlsx
            Vulnerability Test Results/findings.xlsx
            Vulnerability Test Results/bandit-sast-report.txt
          retention-days: 30
          if-no-files-found: error

      # Step 10: Fail Only on Critical Vulnerabilities (Configurable Gate)
      - name: Enforce Security Quality Gate
        if: ${{ github.event.inputs.fail_on_critical != 'false' }}
        run: |
          CRIT_COUNT=$(grep -o '🔴 \*\*Critical\*\* | \*\*[0-9]\+\*\*' "Vulnerability Test Results/executive-summary.md" | grep -o '[0-9]\+' || echo "0")
          echo "Detected Critical Vulnerabilities: $CRIT_COUNT"
          if [ "$CRIT_COUNT" -gt 0 ]; then
            echo "❌ Quality Gate Failed: $CRIT_COUNT Critical Vulnerability(ies) detected. Immediate remediation required."
            exit 1
          fi

